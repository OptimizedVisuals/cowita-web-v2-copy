name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check internal links, assets and CSS references
        run: npm run check-links

      - name: Check for duplicate ids and unresolved form= references
        run: npm run check-ids

      - name: Run unit and integration tests
        run: npm test

      - name: Check SEO metadata is unique and sitemap is current
        run: |
          node tools/generate-seo-files.mjs
          git diff --exit-code -- sitemap.xml robots.txt

      - name: Accessibility audit (axe-core WCAG 2.1 AA, best practices, focus visibility)
        run: npm run a11y

      - name: Build the static site (minified dist/)
        run: npm run build

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production dependencies for high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high